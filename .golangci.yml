version: "2"

run:
  go: "1.23"
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/ethpandaops/pandafuzz

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - unconvert
    - goconst
    - gocyclo
    - gocognit
    - bodyclose
    - noctx
    - unparam
    - nakedret
    - prealloc
    - gocritic
  settings:
    revive:
      severity: warning
      rules:
        - name: context-as-argument
          severity: error
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: error-naming
        - name: error-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: true
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    nakedret:
      max-func-lines: 5
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - gocyclo
        - gocognit
        - errcheck
        - dupl
        - goconst
    - linters:
        - errcheck
      text: "Error return value is not checked"
      path: "logging|logger"
    - path: main\.go
      linters:
        - noctx
      text: "should not use context.Background"
