openapi: 3.0.3
info:
  title: PandaFuzz API
  description: |
    PandaFuzz is a distributed fuzzing orchestration platform that manages fuzzing bots,
    jobs, campaigns, and corpus management. This API provides comprehensive access to
    all platform features with versioning support.
  version: 3.0.0
  contact:
    name: PandaFuzz Team
    url: https://github.com/ethpandaops/pandafuzz
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080/api/v3
    description: Local development server
  - url: https://pandafuzz.example.com/api/v3
    description: Production server

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: bots
    description: Bot management operations
  - name: jobs
    description: Job management operations
  - name: campaigns
    description: Campaign management operations
  - name: corpus
    description: Corpus management operations
  - name: crashes
    description: Crash analysis operations
  - name: results
    description: Result submission operations
  - name: system
    description: System administration operations
  - name: reproducibility
    description: Crash reproduction operations
  - name: coverage
    description: Code coverage analysis operations

paths:
  # Bot Management
  /bots:
    get:
      tags: [bots]
      summary: List all bots
      operationId: listBots
      parameters:
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/sortOrderParam'
      responses:
        '200':
          description: List of bots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [bots]
      summary: Register a new bot
      operationId: registerBot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotRegisterRequest'
      responses:
        '201':
          description: Bot registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotRegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bots/{botId}:
    parameters:
      - $ref: '#/components/parameters/botIdParam'
    
    get:
      tags: [bots]
      summary: Get bot details
      operationId: getBot
      responses:
        '200':
          description: Bot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags: [bots]
      summary: Deregister a bot
      operationId: deregisterBot
      responses:
        '204':
          description: Bot deregistered successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bots/{botId}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/botIdParam'
    
    post:
      tags: [bots]
      summary: Send bot heartbeat
      operationId: botHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotHeartbeatRequest'
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotHeartbeatResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bots/{botId}/jobs/next:
    parameters:
      - $ref: '#/components/parameters/botIdParam'
    
    post:
      tags: [bots]
      summary: Get next job for bot
      operationId: getNextJob
      responses:
        '200':
          description: Job assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '204':
          description: No jobs available
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bots/{botId}/jobs/complete:
    parameters:
      - $ref: '#/components/parameters/botIdParam'
    
    post:
      tags: [bots]
      summary: Complete current job
      operationId: completeJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCompleteRequest'
      responses:
        '200':
          description: Job completion acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCompleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bots/{botId}/metrics:
    parameters:
      - $ref: '#/components/parameters/botIdParam'
    
    get:
      tags: [bots]
      summary: Get bot resource metrics
      operationId: getBotMetrics
      responses:
        '200':
          description: Bot metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResourceMetrics'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Job Management
  /jobs:
    get:
      tags: [jobs]
      summary: List all jobs
      operationId: listJobs
      parameters:
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/fuzzerFilter'
        - $ref: '#/components/parameters/campaignIdFilter'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/sortOrderParam'
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [jobs]
      summary: Create a new job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/jobIdParam'
    
    get:
      tags: [jobs]
      summary: Get job details
      operationId: getJob
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags: [jobs]
      summary: Cancel a job
      operationId: cancelJob
      responses:
        '200':
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCancelResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{jobId}/logs:
    parameters:
      - $ref: '#/components/parameters/jobIdParam'
    
    get:
      tags: [jobs]
      summary: Get job logs
      operationId: getJobLogs
      parameters:
        - name: follow
          in: query
          description: Follow log output (SSE)
          schema:
            type: boolean
            default: false
        - name: lines
          in: query
          description: Number of lines to return
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
      responses:
        '200':
          description: Job logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLogsResponse'
            text/event-stream:
              schema:
                type: string
                description: Server-sent events for real-time logs
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{jobId}/progress:
    parameters:
      - $ref: '#/components/parameters/jobIdParam'
    
    get:
      tags: [jobs]
      summary: Get real-time job progress (SSE)
      operationId: getJobProgress
      responses:
        '200':
          description: Job progress stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events for real-time progress
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{jobId}/crashes:
    parameters:
      - $ref: '#/components/parameters/jobIdParam'
    
    get:
      tags: [jobs, crashes]
      summary: Get crashes for a job
      operationId: getJobCrashes
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: Job crashes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrashListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{jobId}/coverage:
    parameters:
      - $ref: '#/components/parameters/jobIdParam'
    
    get:
      tags: [jobs, coverage]
      summary: List coverage reports for a job
      operationId: getJobCoverage
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/sortOrderParam'
        - name: format
          in: query
          description: Filter by coverage report format
          schema:
            type: string
            enum: [json, html, lcov, cobertura]
        - name: from
          in: query
          description: Filter reports created after this timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Filter reports created before this timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of coverage reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageReportListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{jobId}/coverage/{reportId}:
    parameters:
      - $ref: '#/components/parameters/jobIdParam'
      - $ref: '#/components/parameters/reportIdParam'
    
    get:
      tags: [jobs, coverage]
      summary: Download coverage report
      operationId: downloadCoverageReport
      responses:
        '200':
          description: Coverage report content
          content:
            application/json:
              schema:
                type: object
                description: JSON coverage report
            text/html:
              schema:
                type: string
                description: HTML coverage report
            text/plain:
              schema:
                type: string
                description: LCOV or Cobertura coverage report
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Binary coverage report
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{jobId}/coverage/{reportId}/metadata:
    parameters:
      - $ref: '#/components/parameters/jobIdParam'
      - $ref: '#/components/parameters/reportIdParam'
    
    get:
      tags: [jobs, coverage]
      summary: Get coverage report metadata
      operationId: getCoverageReportMetadata
      responses:
        '200':
          description: Coverage report metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Campaign Management
  /campaigns:
    get:
      tags: [campaigns]
      summary: List all campaigns
      operationId: listCampaigns
      parameters:
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/tagsFilter'
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [campaigns]
      summary: Create a new campaign
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /campaigns/{campaignId}:
    parameters:
      - $ref: '#/components/parameters/campaignIdParam'
    
    get:
      tags: [campaigns]
      summary: Get campaign details
      operationId: getCampaign
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    patch:
      tags: [campaigns]
      summary: Update campaign
      operationId: updateCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpdates'
      responses:
        '200':
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags: [campaigns]
      summary: Delete campaign
      operationId: deleteCampaign
      responses:
        '204':
          description: Campaign deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /campaigns/{campaignId}/stats:
    parameters:
      - $ref: '#/components/parameters/campaignIdParam'
    
    get:
      tags: [campaigns]
      summary: Get campaign statistics
      operationId: getCampaignStats
      responses:
        '200':
          description: Campaign statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStats'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Corpus Management
  /corpus:
    get:
      tags: [corpus]
      summary: List corpus entries
      operationId: listCorpus
      parameters:
        - $ref: '#/components/parameters/campaignIdFilter'
        - $ref: '#/components/parameters/jobIdFilter'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: List of corpus entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [corpus]
      summary: Upload corpus files
      operationId: uploadCorpus
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - campaignId
                - files
              properties:
                campaignId:
                  type: string
                  description: Campaign ID
                jobId:
                  type: string
                  description: Optional job ID
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Corpus files to upload
      responses:
        '201':
          description: Corpus uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /corpus/{corpusId}:
    parameters:
      - $ref: '#/components/parameters/corpusIdParam'
    
    get:
      tags: [corpus]
      summary: Get corpus file details
      operationId: getCorpusFile
      responses:
        '200':
          description: Corpus file details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusFile'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      tags: [corpus]
      summary: Delete corpus file
      operationId: deleteCorpusFile
      responses:
        '204':
          description: Corpus file deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /corpus/{corpusId}/download:
    parameters:
      - $ref: '#/components/parameters/corpusIdParam'
    
    get:
      tags: [corpus]
      summary: Download corpus file
      operationId: downloadCorpusFile
      responses:
        '200':
          description: Corpus file content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /corpus/sync:
    post:
      tags: [corpus]
      summary: Synchronize corpus between campaigns/jobs
      operationId: syncCorpus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpusSyncRequest'
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /corpus/promote:
    post:
      tags: [corpus]
      summary: Promote crash to corpus
      operationId: promoteCrashToCorpus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpusPromotionRequest'
      responses:
        '201':
          description: Crash promoted to corpus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Crash Management
  /crashes:
    get:
      tags: [crashes]
      summary: List all crashes
      operationId: listCrashes
      parameters:
        - $ref: '#/components/parameters/campaignIdFilter'
        - $ref: '#/components/parameters/jobIdFilter'
        - $ref: '#/components/parameters/uniqueFilter'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/sortOrderParam'
      responses:
        '200':
          description: List of crashes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrashListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /crashes/{crashId}:
    parameters:
      - $ref: '#/components/parameters/crashIdParam'
    
    get:
      tags: [crashes]
      summary: Get crash details
      operationId: getCrash
      responses:
        '200':
          description: Crash details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrashResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /crashes/{crashId}/input:
    parameters:
      - $ref: '#/components/parameters/crashIdParam'
    
    get:
      tags: [crashes]
      summary: Download crash input
      operationId: getCrashInput
      responses:
        '200':
          description: Crash input file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Reproducibility
  /reproducibility/requests:
    get:
      tags: [reproducibility]
      summary: List reproduction requests
      operationId: listReproductionRequests
      parameters:
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: List of reproduction requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReproductionRequestListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags: [reproducibility]
      summary: Create reproduction request
      operationId: createReproductionRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReproductionRequestCreate'
      responses:
        '201':
          description: Reproduction request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReproductionRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reproducibility/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/requestIdParam'
    
    get:
      tags: [reproducibility]
      summary: Get reproduction request
      operationId: getReproductionRequest
      responses:
        '200':
          description: Reproduction request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReproductionRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reproducibility/results:
    post:
      tags: [reproducibility]
      summary: Submit reproduction result
      operationId: submitReproductionResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReproductionResult'
      responses:
        '201':
          description: Result submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReproductionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Result Submission
  /results/batch:
    post:
      tags: [results]
      summary: Submit batch results
      operationId: submitBatchResults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchResultRequest'
      responses:
        '200':
          description: Results processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResultResponse'
        '207':
          description: Partial success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /results/crash:
    post:
      tags: [results]
      summary: Submit crash result
      operationId: submitCrashResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrashResult'
      responses:
        '201':
          description: Crash recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrashSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /results/coverage:
    post:
      tags: [results]
      summary: Submit coverage result
      operationId: submitCoverageResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageResult'
      responses:
        '201':
          description: Coverage recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /results/corpus:
    post:
      tags: [results]
      summary: Submit corpus update
      operationId: submitCorpusUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpusUpdate'
      responses:
        '201':
          description: Corpus update recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # System Management
  /system/stats:
    get:
      tags: [system]
      summary: Get system statistics
      operationId: getSystemStats
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStats'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/health:
    get:
      tags: [system]
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /system/recovery:
    post:
      tags: [system]
      summary: Trigger system recovery
      operationId: triggerRecovery
      responses:
        '200':
          description: Recovery initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/maintenance:
    post:
      tags: [system]
      summary: Trigger maintenance
      operationId: triggerMaintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequest'
      responses:
        '200':
          description: Maintenance completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/timeouts:
    get:
      tags: [system]
      summary: List active timeouts
      operationId: listTimeouts
      responses:
        '200':
          description: Active timeouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeoutListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/timeouts/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        description: Timeout type (bot or job)
        schema:
          type: string
          enum: [bot, job]
      - name: id
        in: path
        required: true
        description: Entity ID
        schema:
          type: string
    
    post:
      tags: [system]
      summary: Force timeout
      operationId: forceTimeout
      responses:
        '200':
          description: Timeout forced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeoutForceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    botIdParam:
      name: botId
      in: path
      required: true
      description: Bot identifier
      schema:
        type: string
        format: uuid
    
    jobIdParam:
      name: jobId
      in: path
      required: true
      description: Job identifier
      schema:
        type: string
        format: uuid
    
    campaignIdParam:
      name: campaignId
      in: path
      required: true
      description: Campaign identifier
      schema:
        type: string
        format: uuid
    
    corpusIdParam:
      name: corpusId
      in: path
      required: true
      description: Corpus file identifier
      schema:
        type: string
        format: uuid
    
    crashIdParam:
      name: crashId
      in: path
      required: true
      description: Crash identifier
      schema:
        type: string
        format: uuid
    
    requestIdParam:
      name: requestId
      in: path
      required: true
      description: Request identifier
      schema:
        type: string
        format: uuid
    
    reportIdParam:
      name: reportId
      in: path
      required: true
      description: Coverage report identifier
      schema:
        type: string
        format: uuid
    
    statusFilter:
      name: status
      in: query
      description: Filter by status
      schema:
        type: string
    
    fuzzerFilter:
      name: fuzzer
      in: query
      description: Filter by fuzzer type
      schema:
        type: string
        enum: [afl++, libfuzzer, honggfuzz]
    
    campaignIdFilter:
      name: campaignId
      in: query
      description: Filter by campaign ID
      schema:
        type: string
        format: uuid
    
    jobIdFilter:
      name: jobId
      in: query
      description: Filter by job ID
      schema:
        type: string
        format: uuid
    
    tagsFilter:
      name: tags
      in: query
      description: Filter by tags (comma-separated)
      schema:
        type: string
    
    uniqueFilter:
      name: unique
      in: query
      description: Filter unique crashes only
      schema:
        type: boolean
    
    pageParam:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1
    
    limitParam:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    
    sortByParam:
      name: sortBy
      in: query
      description: Sort field
      schema:
        type: string
    
    sortOrderParam:
      name: sortOrder
      in: query
      description: Sort order
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  schemas:
    # Bot schemas
    Bot:
      type: object
      required:
        - id
        - name
        - hostname
        - status
        - last_seen
        - registered_at
        - capabilities
        - timeout_at
        - is_online
        - failure_count
        - api_endpoint
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
        status:
          $ref: '#/components/schemas/BotStatus'
        last_seen:
          type: string
          format: date-time
        registered_at:
          type: string
          format: date-time
        current_job:
          type: string
          format: uuid
          nullable: true
        capabilities:
          type: array
          items:
            type: string
        timeout_at:
          type: string
          format: date-time
        is_online:
          type: boolean
        failure_count:
          type: integer
        api_endpoint:
          type: string
          format: uri

    BotStatus:
      type: string
      enum:
        - registering
        - idle
        - busy
        - timed_out
        - failed

    BotRegisterRequest:
      type: object
      required:
        - hostname
        - capabilities
        - api_endpoint
      properties:
        hostname:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 100
        capabilities:
          type: array
          items:
            type: string
            pattern: '^[a-zA-Z0-9_-]+$'
            maxLength: 50
          minItems: 1
          maxItems: 10
        api_endpoint:
          type: string
          format: uri
          maxLength: 500

    BotRegisterResponse:
      type: object
      required:
        - bot_id
        - status
        - timestamp
        - timeout
      properties:
        bot_id:
          type: string
          format: uuid
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        timeout:
          type: string
          format: date-time

    BotHeartbeatRequest:
      type: object
      required:
        - status
        - last_activity
      properties:
        status:
          $ref: '#/components/schemas/BotStatus'
        current_job:
          type: string
          format: uuid
          nullable: true
        last_activity:
          type: string
          format: date-time

    BotHeartbeatResponse:
      type: object
      required:
        - status
        - timestamp
        - timeout
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        timeout:
          type: string
          format: date-time

    BotListResponse:
      type: object
      required:
        - bots
        - count
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        count:
          type: integer

    BotResourceMetrics:
      type: object
      required:
        - bot_id
        - timestamp
        - cpu_usage
        - memory_usage
        - disk_usage
        - network_tx
        - network_rx
        - active_jobs
        - jobs_completed
        - uptime
      properties:
        bot_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        cpu_usage:
          type: number
          format: float
          minimum: 0
          maximum: 100
        memory_usage:
          type: integer
          format: int64
        disk_usage:
          type: integer
          format: int64
        network_tx:
          type: integer
          format: int64
        network_rx:
          type: integer
          format: int64
        active_jobs:
          type: integer
        jobs_completed:
          type: integer
        uptime:
          type: string

    # Job schemas
    Job:
      type: object
      required:
        - id
        - name
        - target
        - fuzzer
        - type
        - status
        - created_at
        - timeout_at
        - work_dir
        - config
        - progress
        - use_campaign_corpus
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        target:
          type: string
        fuzzer:
          type: string
          enum: [afl++, libfuzzer, honggfuzz]
        type:
          $ref: '#/components/schemas/JobType'
        status:
          $ref: '#/components/schemas/JobStatus'
        assigned_bot:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        timeout_at:
          type: string
          format: date-time
        work_dir:
          type: string
        config:
          $ref: '#/components/schemas/JobConfig'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        campaign_id:
          type: string
          format: uuid
          nullable: true
        use_campaign_corpus:
          type: boolean
        metadata:
          type: object
          additionalProperties: true

    JobType:
      type: string
      enum:
        - fuzzing
        - minimization
        - reproduction

    JobStatus:
      type: string
      enum:
        - pending
        - assigned
        - running
        - completed
        - failed
        - timed_out
        - cancelled

    JobConfig:
      type: object
      properties:
        duration:
          type: string
          format: duration
        memory_limit:
          type: integer
          format: int64
        timeout:
          type: string
          format: duration
        dictionary:
          type: string
        seed_corpus:
          type: array
          items:
            type: string
        output_dir:
          type: string

    JobRequest:
      type: object
      required:
        - name
        - target
        - fuzzer
      properties:
        name:
          type: string
          maxLength: 100
        target:
          type: string
          maxLength: 500
        fuzzer:
          type: string
          enum: [afl++, libfuzzer, honggfuzz]
        duration:
          type: string
          format: duration
        config:
          $ref: '#/components/schemas/JobConfig'
        campaign_id:
          type: string
          format: uuid
        corpus_id:
          type: string
          format: uuid
        use_campaign_corpus:
          type: boolean
        enable_coverage:
          type: boolean
          default: false
          description: Enable code coverage collection during fuzzing
        coverage_format:
          type: string
          enum: [json, html, lcov, cobertura]
          default: json
          description: Format for coverage reports

    JobCompleteRequest:
      type: object
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        message:
          type: string

    JobCompleteResponse:
      type: object
      required:
        - acknowledged
        - job_id
        - message
        - timestamp
      properties:
        acknowledged:
          type: boolean
        job_id:
          type: string
          format: uuid
        message:
          type: string
        status:
          type: string
        timestamp:
          type: string
          format: date-time

    JobCancelResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time

    JobListResponse:
      type: object
      required:
        - jobs
        - count
        - page
        - limit
        - total
        - sort_by
        - sort_order
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        count:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        sort_by:
          type: string
        sort_order:
          type: string

    JobLogsResponse:
      type: object
      required:
        - job_id
        - logs
        - timestamp
      properties:
        job_id:
          type: string
          format: uuid
        logs:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time

    # Campaign schemas
    Campaign:
      type: object
      required:
        - id
        - name
        - description
        - status
        - target_binary
        - binary_hash
        - created_at
        - updated_at
        - auto_restart
        - max_duration
        - max_jobs
        - job_template
        - shared_corpus
        - tags
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/CampaignStatus'
        target_binary:
          type: string
        binary_hash:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        auto_restart:
          type: boolean
        max_duration:
          type: string
          format: duration
        max_jobs:
          type: integer
        job_template:
          $ref: '#/components/schemas/JobConfig'
        shared_corpus:
          type: boolean
        tags:
          type: array
          items:
            type: string

    CampaignStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
        - paused
        - cancelled
        - corpus_only

    CampaignRequest:
      type: object
      required:
        - name
        - target_binary
      properties:
        name:
          type: string
        description:
          type: string
        target_binary:
          type: string
        auto_restart:
          type: boolean
        max_duration:
          type: string
          format: duration
        max_jobs:
          type: integer
        job_template:
          $ref: '#/components/schemas/JobConfig'
        shared_corpus:
          type: boolean
        tags:
          type: array
          items:
            type: string

    CampaignUpdates:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/CampaignStatus'
        auto_restart:
          type: boolean
        max_duration:
          type: string
          format: duration
        max_jobs:
          type: integer
        shared_corpus:
          type: boolean
        tags:
          type: array
          items:
            type: string

    CampaignStats:
      type: object
      required:
        - campaign_id
        - total_jobs
        - completed_jobs
        - total_crashes
        - unique_crashes
        - total_coverage
        - corpus_size
        - last_updated
      properties:
        campaign_id:
          type: string
          format: uuid
        total_jobs:
          type: integer
        completed_jobs:
          type: integer
        total_crashes:
          type: integer
        unique_crashes:
          type: integer
        total_coverage:
          type: integer
          format: int64
        corpus_size:
          type: integer
          format: int64
        last_updated:
          type: string
          format: date-time

    CampaignListResponse:
      type: object
      required:
        - campaigns
        - count
      properties:
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        count:
          type: integer

    # Corpus schemas
    CorpusFile:
      type: object
      required:
        - id
        - campaign_id
        - job_id
        - bot_id
        - filename
        - hash
        - size
        - coverage
        - new_coverage
        - parent_hash
        - generation
        - created_at
        - is_seed
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        bot_id:
          type: string
          format: uuid
        filename:
          type: string
        hash:
          type: string
        size:
          type: integer
          format: int64
        coverage:
          type: integer
          format: int64
        new_coverage:
          type: integer
          format: int64
        parent_hash:
          type: string
        generation:
          type: integer
        created_at:
          type: string
          format: date-time
        synced_at:
          type: string
          format: date-time
          nullable: true
        is_seed:
          type: boolean

    CorpusUpdate:
      type: object
      required:
        - job_id
        - bot_id
        - files
        - timestamp
        - total_size
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        bot_id:
          type: string
          format: uuid
        files:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
        total_size:
          type: integer
          format: int64

    CorpusListResponse:
      type: object
      required:
        - files
        - count
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/CorpusFile'
        count:
          type: integer

    CorpusUploadResponse:
      type: object
      required:
        - uploaded
        - duplicates
        - errors
      properties:
        uploaded:
          type: integer
        duplicates:
          type: integer
        errors:
          type: array
          items:
            type: string

    CorpusSyncRequest:
      type: object
      required:
        - source_campaign_id
        - target_campaign_id
      properties:
        source_campaign_id:
          type: string
          format: uuid
        target_campaign_id:
          type: string
          format: uuid
        filter_coverage:
          type: boolean
        min_coverage:
          type: integer
          format: int64

    CorpusSyncResponse:
      type: object
      required:
        - synced_files
        - total_size
        - duration
      properties:
        synced_files:
          type: integer
        total_size:
          type: integer
          format: int64
        duration:
          type: string

    CorpusPromotionRequest:
      type: object
      required:
        - crash_id
        - campaign_id
        - reason
      properties:
        crash_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        reason:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 10

    CorpusUpdateResponse:
      type: object
      required:
        - status
        - corpus_id
        - timestamp
      properties:
        status:
          type: string
        corpus_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time

    # Crash schemas
    CrashResult:
      type: object
      required:
        - job_id
        - bot_id
        - hash
        - file_path
        - type
        - timestamp
        - size
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        bot_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        hash:
          type: string
        file_path:
          type: string
        type:
          type: string
          enum: [segfault, assertion, timeout, other]
        signal:
          type: integer
        exit_code:
          type: integer
        timestamp:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        is_unique:
          type: boolean
        input_base64:
          type: string
          format: byte
        output:
          type: string
        stack_trace:
          type: string

    CrashListResponse:
      type: object
      required:
        - crashes
        - count
      properties:
        crashes:
          type: array
          items:
            $ref: '#/components/schemas/CrashResult'
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        sort_by:
          type: string
        sort_order:
          type: string

    CrashSubmitResponse:
      type: object
      required:
        - status
        - crash_id
        - is_unique
        - timestamp
      properties:
        status:
          type: string
        crash_id:
          type: string
          format: uuid
        is_unique:
          type: boolean
        timestamp:
          type: string
          format: date-time

    # Coverage schemas
    CoverageResult:
      type: object
      required:
        - job_id
        - bot_id
        - edges
        - new_edges
        - timestamp
        - exec_count
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        bot_id:
          type: string
          format: uuid
        edges:
          type: integer
        new_edges:
          type: integer
        timestamp:
          type: string
          format: date-time
        exec_count:
          type: integer
          format: int64

    CoverageSubmitResponse:
      type: object
      required:
        - status
        - coverage_id
        - timestamp
      properties:
        status:
          type: string
        coverage_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time

    # Coverage Report schemas
    CoverageReport:
      type: object
      required:
        - id
        - job_id
        - format
        - size
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the coverage report
        job_id:
          type: string
          format: uuid
          description: Job that generated this coverage report
        format:
          type: string
          enum: [json, html, lcov, cobertura]
          description: Format of the coverage report
        size:
          type: integer
          format: int64
          description: Size of the coverage report in bytes
        created_at:
          type: string
          format: date-time
          description: When the coverage report was created
        file_path:
          type: string
          description: Path to the coverage report file
        checksum:
          type: string
          description: SHA256 checksum of the coverage report

    CoverageMetadata:
      type: object
      required:
        - line_coverage
        - function_coverage
        - branch_coverage
        - total_lines
        - covered_lines
        - total_functions
        - covered_functions
        - collected_at
      properties:
        line_coverage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of lines covered by tests
        function_coverage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of functions covered by tests
        branch_coverage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of branches covered by tests
        total_lines:
          type: integer
          minimum: 0
          description: Total number of executable lines
        covered_lines:
          type: integer
          minimum: 0
          description: Number of lines covered by tests
        total_functions:
          type: integer
          minimum: 0
          description: Total number of functions
        covered_functions:
          type: integer
          minimum: 0
          description: Number of functions covered by tests
        total_branches:
          type: integer
          minimum: 0
          description: Total number of branches
        covered_branches:
          type: integer
          minimum: 0
          description: Number of branches covered by tests
        collected_at:
          type: string
          format: date-time
          description: When the coverage data was collected
        report_id:
          type: string
          format: uuid
          description: Associated coverage report ID
        job_id:
          type: string
          format: uuid
          description: Job that generated this coverage data
        source_files:
          type: array
          items:
            type: object
            properties:
              file_path:
                type: string
              line_coverage:
                type: number
                format: float
                minimum: 0
                maximum: 100
              covered_lines:
                type: integer
              total_lines:
                type: integer
          description: Per-file coverage statistics

    CoverageReportListResponse:
      type: object
      required:
        - reports
        - count
        - page
        - limit
        - total
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/CoverageReport'
        count:
          type: integer
          description: Number of reports in this page
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of coverage reports for this job
        sort_by:
          type: string
          description: Field used for sorting
        sort_order:
          type: string
          enum: [asc, desc]
          description: Sort order applied

    # Reproducibility schemas
    ReproductionRequest:
      type: object
      required:
        - id
        - crash_id
        - campaign_id
        - job_id
        - status
        - priority
        - attempt_count
        - max_attempts
        - requested_at
        - timeout_at
        - config
      properties:
        id:
          type: string
          format: uuid
        crash_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        bot_id:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/ReproducibilityStatus'
        priority:
          type: integer
        attempt_count:
          type: integer
        max_attempts:
          type: integer
        requested_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        timeout_at:
          type: string
          format: date-time
        config:
          $ref: '#/components/schemas/JobConfig'

    ReproducibilityStatus:
      type: string
      enum:
        - unknown
        - testing
        - confirmed
        - flaky
        - failed

    ReproductionRequestCreate:
      type: object
      required:
        - crash_id
        - priority
      properties:
        crash_id:
          type: string
          format: uuid
        priority:
          type: integer
          minimum: 1
          maximum: 10
        max_attempts:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        config:
          $ref: '#/components/schemas/JobConfig'

    ReproductionRequestListResponse:
      type: object
      required:
        - requests
        - count
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/ReproductionRequest'
        count:
          type: integer

    ReproductionResult:
      type: object
      required:
        - request_id
        - crash_id
        - bot_id
        - attempt_number
        - status
        - reproduced
        - execution_time
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        crash_id:
          type: string
          format: uuid
        bot_id:
          type: string
          format: uuid
        attempt_number:
          type: integer
        status:
          $ref: '#/components/schemas/ReproducibilityStatus'
        reproduced:
          type: boolean
        execution_time:
          type: string
          format: duration
        signal:
          type: integer
        exit_code:
          type: integer
        output:
          type: string
        stack_trace:
          type: string
        stack_hash:
          type: string
        matches_original:
          type: boolean
        environment_info:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string
          format: date-time

    # Batch result schemas
    BatchResultRequest:
      type: object
      required:
        - bot_id
        - job_id
      properties:
        bot_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        crashes:
          type: array
          items:
            $ref: '#/components/schemas/CrashResult'
        coverage:
          type: array
          items:
            $ref: '#/components/schemas/CoverageResult'
        corpus:
          type: array
          items:
            $ref: '#/components/schemas/CorpusUpdate'

    BatchResultResponse:
      type: object
      required:
        - status
        - bot_id
        - job_id
        - processed
        - timestamp
      properties:
        status:
          type: string
        bot_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        processed:
          type: object
          properties:
            crashes:
              type: integer
            coverage:
              type: integer
            corpus:
              type: integer
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: string
        partial_success:
          type: boolean

    # System schemas
    SystemStats:
      type: object
      required:
        - server
        - state
        - timeouts
        - database
        - timestamp
      properties:
        server:
          type: object
          additionalProperties: true
        state:
          type: object
          additionalProperties: true
        timeouts:
          type: object
          additionalProperties: true
        database:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
              message:
                type: string

    RecoveryResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time

    MaintenanceRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [cleanup, optimize, backup, recovery, vacuum]
        target:
          type: string
        force:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string

    MaintenanceResponse:
      type: object
      required:
        - status
        - type
        - duration
        - timestamp
      properties:
        status:
          type: string
        type:
          type: string
        target:
          type: string
        duration:
          type: string
        timestamp:
          type: string
          format: date-time

    TimeoutListResponse:
      type: object
      required:
        - bot_timeouts
        - job_timeouts
        - timestamp
      properties:
        bot_timeouts:
          type: array
          items:
            type: object
            properties:
              bot_id:
                type: string
              timeout_at:
                type: string
                format: date-time
        job_timeouts:
          type: array
          items:
            type: object
            properties:
              job_id:
                type: string
              timeout_at:
                type: string
                format: date-time
        timestamp:
          type: string
          format: date-time

    TimeoutForceResponse:
      type: object
      required:
        - status
        - type
        - entity_id
        - timestamp
      properties:
        status:
          type: string
        type:
          type: string
        entity_id:
          type: string
        timestamp:
          type: string
          format: date-time

    # Error responses
    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
          format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    PayloadTooLarge:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'